<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div class="modal-cont"></div>
    <div class="first">

      <li>

      <li class="">
        <button class="pagination-btn btn-next">→</button>

    <section class="section-container footer">
      <p class="footer-text">© 2021 | All Rights Reserved |
Developed with ♥ by GoIT Students</p>
